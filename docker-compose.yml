version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: twinprop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twinprop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-twinprop}
      POSTGRES_DB: ${POSTGRES_DB:-twinprop}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twinprop -d twinprop"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: twinprop_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://twinprop:twinprop@postgres:5432/twinprop
      - APP_NAME=TwinProp-DX
      - DEBUG=true
      - API_PREFIX=/api
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: twinprop_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
